name: Playwright E2E Tests
on:
  push:
    branches: [ dev, main, master, "test/**", "feat/**", "fix/**" ]
  pull_request:
    branches: [ dev, main, master, "test/**", "feat/**", "fix/**" ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://coozrchkezephykqermk.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvb3pyY2hrZXplcGh5a3Flcm1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjcxMzksImV4cCI6MjEwMDMwMzEzOX0.NdY_4jviRsKxr3EPXDXTizVqwEmnNzwbJwSR8mi-LVg
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          tests-e2e/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: frontend

    - name: Install E2E Tests Dependencies
      run: npm ci
      working-directory: tests-e2e

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: tests-e2e

    - name: Run Playwright tests
      run: npm run test
      working-directory: tests-e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: tests-e2e/playwright-report/
        retention-days: 30
